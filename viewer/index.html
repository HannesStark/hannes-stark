<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <link rel="icon" href="./favicon.ico" type="image/x-icon">
        <title>Mol* Viewer</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            hr {
                margin: 10px;
            }
            h1, h2, h3, h4, h5 {
                margin-top: 5px;
                margin-bottom: 3px;
            }
            button {
                padding: 2px;
            }
            #app {
                position: absolute;
                left: 0;
                top: 0;
                right: 0;
                bottom: 0;
            }
        </style>
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/molstar@5.8.0/build/viewer/molstar.css" />
    </head>
    <body>
        <div id="app"></div>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/molstar@5.8.0/build/viewer/molstar.js"></script>
        <script type="text/javascript">
            function getParam(name, regex) {
                var r = new RegExp(name + '=' + '(' + regex + ')[&]?', 'i');
                return decodeURIComponent(((window.location.search || '').match(r) || [])[1] || '');
            }

            var debugMode = getParam('debug-mode', '[^&]+').trim() === '1';
            if (debugMode) molstar.setDebugMode(debugMode);

            var timingMode = getParam('timing-mode', '[^&]+').trim() === '1';
            if (timingMode) molstar.setTimingMode(timingMode);

            var hideControls = getParam('hide-controls', '[^&]+').trim() === '1';
            var collapseLeftPanel = getParam('collapse-left-panel', '[^&]+').trim() === '1';
            var pdbProvider = getParam('pdb-provider', '[^&]+').trim().toLowerCase();
            var emdbProvider = getParam('emdb-provider', '[^&]+').trim().toLowerCase();
            var mapProvider = getParam('map-provider', '[^&]+').trim().toLowerCase();
            var pixelScale = getParam('pixel-scale', '[^&]+').trim();
            var pickScale = getParam('pick-scale', '[^&]+').trim();
            var pickPadding = getParam('pick-padding', '[^&]+').trim();
            var transparency = getParam('transparency', '[^&]+').trim().toLowerCase();
            var preferWebgl1 = getParam('prefer-webgl1', '[^&]+').trim() === '1' || void 0;
            var allowMajorPerformanceCaveat = getParam('allow-major-performance-caveat', '[^&]+').trim() === '1';
            var powerPreference = getParam('power-preference', '[^&]+').trim().toLowerCase();
            var illumination = getParam('illumination', '[^&]+').trim() === '1';
            var resolutionMode = getParam('resolution-mode', '[^&]+').trim().toLowerCase();
            var viewportShowToggleFullscreen = getParam('show-toggle-fullscreen', '[^&]+').trim() === '1';

            // First two colors are blue and yellow; rest retained from the default many-distinct palette
            var customPaletteColors = [
                0x009CE0, // Blue (0, 156, 224)
                0xFCC400, // Yellow (252, 196, 0)
                0x1b9e77, 0xd95f02, 0x7570b3, 0xe7298a, 0x66a61e, 0xe6ab02, 0xa6761d, 0x666666,
                0xe41a1c, 0x377eb8, 0x4daf4a, 0x984ea3, 0xff7f00, 0xffff33, 0xa65628, 0xf781bf, 0x999999,
                0x66c2a5, 0xfc8d62, 0x8da0cb, 0xe78ac3, 0xa6d854, 0xffd92f, 0xe5c494, 0xb3b3b3
            ];

            var illustrativeColorParams = {
                style: {
                    name: 'entity-id',
                    params: {
                        overrideWater: true,
                        waterColor: 0xFF0D0D,
                        palette: {
                            name: 'colors',
                            params: {
                                list: { kind: 'set', colors: customPaletteColors }
                            }
                        }
                    }
                },
                carbonLightness: 0
            };

            molstar.Viewer.create('app', {
                disabledExtensions: [],
                layoutShowControls: !hideControls,
                viewportShowExpand: false,
                viewportShowToggleFullscreen: viewportShowToggleFullscreen,
                collapseLeftPanel: collapseLeftPanel,
                pdbProvider: pdbProvider || 'pdbe',
                emdbProvider: emdbProvider || 'pdbe',
                volumeStreamingServer: (mapProvider || 'pdbe') === 'rcsb'
                    ? 'https://maps.rcsb.org'
                    : 'https://www.ebi.ac.uk/pdbe/densities',
                pixelScale: parseFloat(pixelScale) || 1,
                pickScale: parseFloat(pickScale) || 0.25,
                pickPadding: isNaN(parseFloat(pickPadding)) ? 1 : parseFloat(pickPadding),
                transparency: transparency || undefined,
                preferWebgl1: preferWebgl1,
                allowMajorPerformanceCaveat: allowMajorPerformanceCaveat,
                powerPreference: powerPreference || 'high-performance',
                illumination: illumination,
                resolutionMode: resolutionMode || 'auto',
            }).then(viewer => {
                // Set white background
                viewer.plugin.canvas3d?.setProps({ renderer: { backgroundColor: 0xffffff } });

                // Apply illustrative style globally: ignoreLight + outline + occlusion
                // (Do NOT override DefaultRepresentationPreset — that switches to spacefill.
                //  We keep the default cartoon and apply illustrative colors + style on top.)
                viewer.plugin.managers.structure.component.setOptions({
                    ...viewer.plugin.managers.structure.component.state.options,
                    ignoreLight: true
                });
                var pp = viewer.plugin.canvas3d?.props.postprocessing;
                if (pp && viewer.plugin.canvas3d) {
                    viewer.plugin.canvas3d.setProps({
                        postprocessing: {
                            outline: {
                                name: 'on',
                                params: pp.outline.name === 'on' ? pp.outline.params : {
                                    scale: 1, color: 0x000000, threshold: 0.33, includeTransparent: true
                                }
                            },
                            occlusion: {
                                name: 'on',
                                params: pp.occlusion.name === 'on' ? pp.occlusion.params : {
                                    multiScale: { name: 'off', params: {} },
                                    radius: 5, bias: 0.8, blurKernelSize: 15, blurDepthBias: 0.5,
                                    samples: 32, resolutionScale: 1, color: 0x000000, transparentThreshold: 0.4
                                }
                            },
                            shadow: { name: 'off', params: {} }
                        }
                    });
                }

                // Override buildRepresentation so every representation — whether created by a
                // preset, manually added via the UI, or added programmatically — always uses
                // the illustrative color theme with our custom blue/yellow palette.
                //
                // When props.type is a string, createStructureRepresentationParams takes the
                // createParamsByName branch and expects color as a string too.
                // When props.type is already a provider object (e.g. from the Add Component UI),
                // it takes the createParamsProvider branch and expects color as a provider object.
                var _reprBuilder = viewer.plugin.builders.structure.representation;
                var _origBuildRepr = _reprBuilder.buildRepresentation.bind(_reprBuilder);
                var _illustrativeColorProvider = viewer.plugin.representation.structure.themes.colorThemeRegistry.get('illustrative');
                _reprBuilder.buildRepresentation = function (builder, structure, props, options) {
                    var color = (typeof (props && props.type) === 'string') ? 'illustrative' : _illustrativeColorProvider;
                    return _origBuildRepr(builder, structure, Object.assign({}, props, {
                        color: color,
                        colorParams: illustrativeColorParams
                    }), options);
                };

                var snapshotId = getParam('snapshot-id', '[^&]+').trim();
                if (snapshotId) viewer.setRemoteSnapshot(snapshotId);

                var snapshotUrl = getParam('snapshot-url', '[^&]+').trim();
                var snapshotUrlType = getParam('snapshot-url-type', '[^&]+').toLowerCase().trim() || 'molj';
                if (snapshotUrl && snapshotUrlType) viewer.loadSnapshotFromUrl(snapshotUrl, snapshotUrlType);

                var structureUrl = getParam('structure-url', '[^&]+').trim();
                var structureUrlFormat = getParam('structure-url-format', '[a-z]+').toLowerCase().trim();
                var structureUrlIsBinary = getParam('structure-url-is-binary', '[^&]+').trim() === '1';
                if (structureUrl) viewer.loadStructureFromUrl(structureUrl, structureUrlFormat, structureUrlIsBinary);

                var mvsUrl = getParam('mvs-url', '[^&]+').trim();
                var mvsData = getParam('mvs-data', '[^&]+').trim();
                var mvsFormat = getParam('mvs-format', '[^&]+').trim() || 'mvsj';
                if (mvsUrl && mvsData) console.error('Cannot specify mvs-url and mvs-data URL parameters at the same time. Ignoring both.');
                else if (mvsUrl) viewer.loadMvsFromUrl(mvsUrl, mvsFormat);
                else if (mvsData) viewer.loadMvsData(mvsData, mvsFormat);

                var pdb = getParam('pdb', '[^&]+').trim();
                if (pdb) viewer.loadPdb(pdb);

                var pdbIhm = getParam('pdb-ihm', '[^&]+').trim();
                if (pdbIhm) viewer.loadPdbIhm(pdbIhm);
                var pdbDev = getParam('pdb-dev', '[^&]+').trim();
                if (pdbDev) viewer.loadPdbIhm(pdbDev);

                var emdb = getParam('emdb', '[^&]+').trim();
                if (emdb) viewer.loadEmdb(emdb);

                var afdb = getParam('afdb', '[^&]+').trim();
                if (afdb) viewer.loadAlphaFoldDb(afdb);

                var modelArchive = getParam('model-archive', '[^&]+').trim();
                if (modelArchive) viewer.loadModelArchive(modelArchive);

                window.addEventListener('unload', () => {
                    viewer.dispose();
                });

                // Add Surface for selection — injected into Quick Styles panel next to "Illustrative"
                async function addSurfaceForSelection() {
                    var plugin = viewer.plugin;
                    var allStructures = plugin.managers.structure.hierarchy.current.structures;
                    console.log('[Add Surface] structures:', allStructures.length);

                    for (var si = 0; si < allStructures.length; si++) {
                        var s = allStructures[si];
                        var structureData = s.cell && s.cell.obj && s.cell.obj.data;
                        if (!structureData) { console.warn('[Add Surface] no structureData'); continue; }

                        var hasSelection = plugin.managers.structure.selection.structureHasSelection(s);
                        console.log('[Add Surface] hasSelection:', hasSelection);
                        if (!hasSelection) continue;

                        // getStructure returns the selected sub-structure
                        var subStructure = plugin.managers.structure.selection.getStructure(structureData);
                        console.log('[Add Surface] subStructure:', subStructure, 'elementCount:', subStructure && subStructure.elementCount);
                        if (!subStructure || subStructure.elementCount === 0) continue;

                        // Build bundle using StructureElement.Bundle.fromSubStructure
                        var SE = molstar && molstar.lib && molstar.lib.StructureElement;
                        console.log('[Add Surface] StructureElement:', SE);
                        if (!SE || !SE.Bundle) { console.error('[Add Surface] No StructureElement.Bundle'); continue; }

                        var bundle = SE.Bundle.fromSubStructure(structureData, subStructure);
                        console.log('[Add Surface] bundle:', bundle);

                        var key = 'sel-surface-' + Date.now();
                        var component = await plugin.builders.structure.tryCreateComponent(
                            s.cell,
                            { type: { name: 'bundle', params: bundle }, nullIfEmpty: true, label: 'Selection Surface' },
                            key
                        );
                        console.log('[Add Surface] component:', component);

                        if (component) {
                            // Use the registry to get the molecular-surface provider
                            var reprProvider = plugin.representation.structure.registry.get('molecular-surface');
                            console.log('[Add Surface] reprProvider:', reprProvider);
                            await plugin.builders.structure.representation.addRepresentation(component, {
                                type: reprProvider || 'molecular-surface',
                                typeParams: { quality: 'medium' }
                            });
                        }
                    }
                }

                // Inject "Add Surface" button next to "Illustrative" in the Quick Styles panel.
                // Uses MutationObserver to re-inject after React re-renders.
                function injectAddSurfaceButton() {
                    var allBtns = document.querySelectorAll('button');
                    var illustrativeBtn = null;
                    for (var i = 0; i < allBtns.length; i++) {
                        if (allBtns[i].textContent.trim() === 'Illustrative') {
                            illustrativeBtn = allBtns[i];
                            break;
                        }
                    }
                    if (!illustrativeBtn) return;
                    var row = illustrativeBtn.parentNode;
                    if (!row || row.querySelector('[data-custom="add-surface"]')) return;

                    var btn = document.createElement('button');
                    btn.setAttribute('data-custom', 'add-surface');
                    btn.className = illustrativeBtn.className;
                    btn.textContent = 'Add Surface';
                    btn.addEventListener('click', addSurfaceForSelection);
                    row.appendChild(btn);
                }

                var _uiObserver = new MutationObserver(injectAddSurfaceButton);
                _uiObserver.observe(document.getElementById('app'), { childList: true, subtree: true });

                const event = new CustomEvent("molstarViewerCreated", { detail: { viewer } });
                window.dispatchEvent(event);
            });
        </script>
    </body>
</html>
